# Configuração do profile "test" (@ActiveProfiles("test")).
#
# Sem este arquivo, o profile não trocava nada: os testes de integração caíam no
# application.properties principal e escreviam no banco de PRODUÇÃO, apesar de os
# comentários deles dizerem que usavam o banco de testes. A variável
# ROOMMAKER_MONGODB_URI_TESTES existia no .env e não era lida por ninguém.
#
# O default é localhost de propósito: se a variável faltar, o teste falha por não
# achar Mongo — e não escreve em produção por engano.
spring.data.mongodb.uri=${ROOMMAKER_MONGODB_URI_TESTES:mongodb://localhost:27017/roommaker-testes?retryWrites=false}
